name: ci

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить лимит строк
        run: python tools/check_limits.py
      - name: Проверить актуальность реестра методов
        run: python tools/registry_scan.py --check
