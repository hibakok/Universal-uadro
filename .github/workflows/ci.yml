name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить лимит строк
        run: python tools/check_limits.py
      - name: Запустить тесты
        run: python -m unittest discover -s tests -t .
      - name: Регенерировать реестр методов
        run: python tools/registry_scan.py
      - name: Закоммитить реестр, если изменился
        run: |
          git config user.name "uadro-ci"
          git config user.email "actions@github.com"
          git add -A registry/
          if git diff --cached --quiet; then
            echo "Реестр актуален — коммит не нужен"
          else
            git commit -m "ci: регенерация реестра методов"
            git push
          fi
      - name: Самопроверка реестра
        run: python tools/registry_scan.py --check
